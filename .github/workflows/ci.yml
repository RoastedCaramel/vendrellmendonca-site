name: CI
on:
  push:
    branches: [main]   # run when push to main
  pull_request:        # and on every pull request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "True"

    steps:
      # https://docs.astral.sh/uv/guides/integration/github/#installation
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # false stops the git token being left on disk for later steps

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.13.5"

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked

      # used uv run ruff instead of ruff-action
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest
