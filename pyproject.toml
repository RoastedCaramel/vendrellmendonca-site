[project]
name = "vendrellmendonca-site"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "environs>=15.2.0",
    "gunicorn>=26.2.0",
    "markdown>=3.11.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

# using ruff for lint
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations"]

#ruff linting rules
[tool.ruff.lint]
select = [
    "E", "F",   # pycodestyle errors, pyflakes (basic mistakes)
    "I",        # import sorting
    "B",        # likely bugs (flake8-bugbear)
    "UP",       # outdated syntax
    "DJ",       # Django-specific checks
    "S",        # security checks (bandit rules)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]    # asserts are fine in tests
"**/test_*.py" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--cov=core --cov=blog --cov-report=term-missing"
